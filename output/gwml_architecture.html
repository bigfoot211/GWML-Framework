<html style="margin:0;padding:0;"><title>GWML 框架架构图（P-M-P 闭环）</title><div style="width:100%;box-sizing:border-box;font-family:'Microsoft YaHei',system-ui,sans-serif;background:#f7f9fc;padding:12px;">

  <style>

  <!-- 标题 -->
  <text x="590" y="34" text-anchor="middle" class="ttl">GWML 时空地理加权机器学习框架 —— P（格局）·M（机制）·P（预测）三环闭环</text>
  <text x="590" y="56" text-anchor="middle" class="sub">依据两篇论文方法实现：CEUS《A spatiotemporal geographically weighted machine learning framework》· 农业工程学报《多地形下湖南省农村居民点人地耦合分异及情景优化》｜数值为合成演示数据输出（标注"演示"）</text>

    </g>
    <g class="box1">

      <text x="595" y="126" text-anchor="middle" class="tx" fill="#1b263b">② 样本表：坐标(x,y) + 驱动因子矩阵 X + 目标 y</text>
    </g>
    <g class="box1">
      <rect x="800" y="110" width="320" height="24" rx="6"/>
      <text x="960" y="126" text-anchor="middle" class="tx" fill="#1b263b">③ 两期土地利用栅格 t1/t2（地类编码）</text>
    </g>
  </g>

  <!-- 输入到三模块的箭头 -->

    <rect x="62" y="306" width="296" height="52" rx="6" class="box"/>

    <line x1="210" y1="358" x2="210" y2="370" stroke="#33415c" stroke-width="1.4" marker-end="url(#arr)"/>

    <rect x="62" y="372" width="296" height="42" rx="6" class="box"/>
    <text x="210" y="389" text-anchor="middle" class="h2" fill="#1b263b">输出：逐单元演化类型 + 差分表</text>
    <text x="210" y="405" text-anchor="middle" class="txs">演示 n=600：T3 192 · T4 150 · T1 133 · T2 125</text>
  </g>

  <!-- ============ 模块2 GWRF + GNID ============ -->

    <line x1="590" y1="346" x2="590" y2="358" stroke="#33415c" stroke-width="1.4" marker-end="url(#arr)"/>

    <text x="590" y="408" text-anchor="middle" class="txs">GWRF R²=0.623（5折空间CV RMSE=1.61，演示）</text>
  </g>

  <!-- ============ 模块3 SA-CA-Markov ============ -->
  <g>
    <rect x="800" y="180" width="340" height="330" rx="10" class="box3"/>
    <text x="970" y="206" text-anchor="middle" class="h1" fill="#b45309">模块 3 · SA-CA-Markov 情景预测</text>
    <text x="970" y="224" text-anchor="middle" class="txs" fill="#5c677d">机理约束元胞自动机-马尔可夫（CEUS 3.4 / 农工 2.3）</text>

    <text x="970" y="275" text-anchor="middle" class="txs">P'(i→j|u) ∝ P(i→j)·S_j(u)·C_j(u)（式(7)，逐像元校正）</text>
    <line x1="970" y1="286" x2="970" y2="298" stroke="#33415c" stroke-width="1.4" marker-end="url(#arr)"/>

    <text x="970" y="394" text-anchor="middle" class="txs">S1 基准+95.9% · S2 生态+37.2% · S3 均衡+66.6%（演示）</text>
    <text x="970" y="408" text-anchor="middle" class="txs">回溯 Kappa=0.732（演示）</text>
  </g>

  <!-- P→M 反馈（DIC类型 → 模块2） -->
  <path d="M 210 510 C 210 548, 440 540, 540 512" fill="none" stroke="#d00000" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arrR)"/>
  <text x="330" y="548" text-anchor="middle" class="lbl" fill="#d00000">P→M：演化类型作为分层/因子筛选的空间分类基础</text>

  <!-- M→P 反馈（模块2 → 模块3） -->
  <path d="M 760 342 L 822 342" fill="none" stroke="#33415c" stroke-width="2.2" marker-end="url(#arr)"/>
  <text x="791" y="333" text-anchor="middle" class="lbl">适宜性面 S(u)</text>
  <text x="791" y="354" text-anchor="middle" class="lbl">约束面 C(u)</text>

  <!-- P→P 反馈（模块3 → 模块1 校验） -->
  <path d="M 970 510 C 970 620, 200 620, 210 512" fill="none" stroke="#d00000" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arrR)"/>
  <text x="590" y="630" text-anchor="middle" class="lbl" fill="#d00000">P→P 闭环：模拟结果回算景观指标 → 与 DIC 差分对比 → 情景合理性校验（回溯 Kappa / 面积误差）</text>

  <!-- ============ 评价体系 ============ -->
  <g>
    <rect x="40" y="650" width="1100" height="92" rx="10" class="box4"/>
    <text x="60" y="674" class="h2" fill="#5b3cc4">模型评价体系（CEUS 表4 / 农工 2.4）</text>
    <g class="box">
      <rect x="60" y="684" width="200" height="48" rx="6"/>

    </g>
    <g class="box">
      <rect x="280" y="684" width="200" height="48" rx="6"/>
      <text x="380" y="704" text-anchor="middle" class="h2" fill="#1b263b">空间相关</text>

    <g class="box">

      <text x="600" y="722" text-anchor="middle" class="tx">Kappa / 总体精度</text>
    </g>
    <g class="box">
      <rect x="720" y="684" width="200" height="48" rx="6"/>
      <text x="820" y="704" text-anchor="middle" class="h2" fill="#1b263b">稳健性</text>
      <text x="820" y="722" text-anchor="middle" class="tx">5 折空间交叉验证（KMeans 分块）</text>
    </g>
    <g class="box">
      <rect x="940" y="684" width="180" height="48" rx="6"/>
      <text x="1030" y="704" text-anchor="middle" class="h2" fill="#1b263b">模型对照</text>
      <text x="1030" y="722" text-anchor="middle" class="tx">OLS / GWR / RF / GWRF / GNID</text>
    </g>
  </g>

  <!-- ============ 演示输出对照 ============ -->
  <g>
    <rect x="40" y="762" width="1100" height="228" rx="10" fill="#ffffff" stroke="#8d99ae" stroke-width="1.2"/>
    <text x="60" y="786" class="h2" fill="#1b263b">演示输出对照（合成数据，仅验证流程可用性，不代表真实区域结论）</text>

    <g class="box1">
      <rect x="60" y="800" width="330" height="176" rx="6"/>
      <text x="225" y="820" text-anchor="middle" class="h2" fill="#1b5e9e">① DIC 演化类型分布（n=600）</text>
      <rect x="80" y="832" width="290" height="14" rx="3" fill="#e8f1fb"/>
      <rect x="80" y="832" width="96" height="14" rx="3" fill="#3a6ea5"/>
      <text x="388" y="843" class="tx">T1 集聚强化 133（22.2%）</text>
      <rect x="80" y="852" width="290" height="14" rx="3" fill="#e8f1fb"/>
      <rect x="80" y="852" width="90" height="14" rx="3" fill="#2a9d5f"/>
      <text x="388" y="863" class="tx">T2 破碎主导 125（20.8%）</text>
      <rect x="80" y="872" width="290" height="14" rx="3" fill="#e8f1fb"/>
      <rect x="80" y="872" width="139" height="14" rx="3" fill="#e07b00"/>
      <text x="388" y="883" class="tx">T3 扩张驱动 192（32.0%）</text>
      <rect x="80" y="892" width="290" height="14" rx="3" fill="#e8f1fb"/>
      <rect x="80" y="892" width="108" height="14" rx="3" fill="#7b4fd8"/>
      <text x="388" y="903" class="tx">T4 稳定均衡 150（25.0%）</text>
      <text x="225" y="930" text-anchor="middle" class="txs" fill="#5c677d">扩张主导 → 与湖南省农村居民点扩张背景一致（示意）</text>
      <text x="225" y="946" text-anchor="middle" class="txs" fill="#5c677d">阈值：ΔPD 0.10 · ΔAI 0.05 · ΔCONN 0.05</text>
    </g>

    <g class="box2">
      <rect x="415" y="800" width="330" height="176" rx="6"/>
      <text x="580" y="820" text-anchor="middle" class="h2" fill="#1e7d4f">② GWRF 多尺度带宽与模型对照</text>
      <rect x="435" y="832" width="290" height="104" rx="5" fill="#f2faf5" stroke="#cfe8d9"/>
      <text x="580" y="852" text-anchor="middle" class="tx">road_density 115.1 km（县域+） · gdp 55.5 km（市域）</text>
      <text x="580" y="870" text-anchor="middle" class="tx">elevation 75.4 km · pop 75.4 km · slope 15.8 km（局地）</text>
      <text x="580" y="888" text-anchor="middle" class="txs" fill="#5c677d">→ 各因子作用尺度明显不同（多尺度效应成立）</text>
      <text x="580" y="906" text-anchor="middle" class="txs" fill="#5c677d">重要度：gdp 0.90 主导 · 河距 0.056 · 路网 0.018（置换法）</text>
      <text x="580" y="924" text-anchor="middle" class="txs" fill="#5c677d">对照 R²：OLS 0.539 · GWR 0.721 · RF 0.945 · GWRF 0.623</text>

    </g>

    <g class="box3">
      <rect x="770" y="800" width="350" height="176" rx="6"/>

      <text x="945" y="968" text-anchor="middle" class="txs" fill="#8d99ae">论文实证（真实数据）：+12.3% / +3.1% / +6.8%，Kappa 0.71</text>

<p style="font-size:14px;color:#5c677d;margin:8px 2px 0;">架构说明：三个模块构成 P（格局）→ M（机制）→ P（预测）闭环。模块 1 输出的演化类型作为模块 2 分层探测的空间基础（红色虚线 P→M）；模块 2 输出的适宜性面与约束面嵌入模块 3 的转移概率校正（M→P）；模块 3 模拟结果回算景观指标与模块 1 差分互检（红色虚线 P→P 校验环）。图中"演示"数值均来自本包合成数据一键演示，论文实证数值见 README 第 13 节。</p>
